# Extract of The Catalogue of Planetary Analogues (task T53). Frozen before any value was read at these sites.
# Facts only (feature directory, chapter names, coordinates as printed). The catalogue itself is not redistributed.
source:
  title: "CAFE, Concepts for Activities in the Field for Exploration. TN2: The Catalogue of Planetary Analogues"
  authors: "Louisa Preston, Monica Grady, Simeon Barber (Planetary and Space Sciences Research Institute, The Open University, UK)"
  contract: "ESA contract 4000104716/11/NL/AF"
  version: "Final Version: December 5th 2012"
  url: https://esamultimedia.esa.int/docs/gsp/The_Catalogue_of_Planetary_Analogues.pdf
  retrieved: 2026-11-25
  sha256: f1ec1641617b114f5a8f49c7956aaddbf0e5277aebc63a77d9c950bdb1cdba20
  pages: 171
  licence: "not stated in the document"
  linked_from: https://www.esa.int/Our_Activities/Preparing_for_the_Future/Discovery_and_Preparation/Cataloguing_otherworldly_landscapes_on_Earth
  selection_criteria_quote: >-
    "the number one priority for choosing an analogue site [...] is scientific merit and relevance for the Moon and/or
    Mars. Once this criterion has been satisfied, the next consideration is the cost of the mission, followed by the
    accessibility of the site in terms of permits and physical access, and then the ability of the site to house the
    infrastructure needed" (CAFE Executive Summary, same authors, https://esamultimedia.esa.int/docs/gsp/C4000104716ExS.pdf)

