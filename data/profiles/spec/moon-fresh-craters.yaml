id: moon-fresh-craters
body: moon
name: Fresh (Copernican) craters
kind: distribution
status: ready
catalogue_environments: [fresh-craters]
selection:
  rule: 1 km windows of SLDEM2015 inside crater units mapped as Copernican on the USGS Unified Geologic Map.
  steps:
    - {product: sldem2015, condition: "1 km window inside 60°S to 60°N", uses: [latitude]}
    - {product: usgs-unified-geologic-map, condition: "unit age is Copernican", uses: [map_unit_age]}
  parameters:
    - {name: units, value: [Cc, Ccc, Csc], sensitivity: [[Cc]], reason: "the three Copernican crater units of the map (T41)"}
    - {name: min_unit_share, value: 0.9, sensitivity: [0.5, 1.0], reason: "a window is inside a unit when at least 90% of 25 samples fall in it (T41, as the 90% valid-pixel rule)"}
parameters:
  - dimension: topography
    names: [slope_mean, slope_p95, slope_max, roughness, roughness_detrended, traversable_15, traversable_20, traversable_25]
    product: sldem2015
    scale: 1 km windows of about 60 m pixels
    effective_resolution: near 512 ppd (stated)
statistics:
  percentiles: [5, 10, 25, 50, 75, 90, 95]
  joint: every window vector kept
biases:
  - Map units at 1:5,000,000 miss small fresh craters; only large ones are selected.
  - The Robbins 2019 crater database (not verified) could add small craters but gives no age by itself.
cannot_characterize: [vacuum, gravity, space weathering]
