# Earth data catalogue (task T12). Same schema and rules as moon.yaml, plus `attribution` and `use`
# (similarity, mask, qualification, operations) for every Earth layer (tools/catalog/catalog.py).
# Environment ids are the Earth search domain: global-land unless stated.
products:
  # ---------------- Topography ----------------
  - id: copernicus-dem-glo30
    body: earth
    mission: TanDEM-X (Copernicus contributing mission)
    instrument: X-band SAR interferometry
    product: Copernicus DEM GLO-30 (2021 release on AWS)
    producer: DLR and Airbus Defence and Space for ESA / EU Copernicus
    url: https://registry.opendata.aws/copernicus-dem/
    access: {format: "Cloud Optimized GeoTIFF, 32-bit float", size: "not stated on page", licence: "free licence for the general public (Copernicus DEM licence)", account: "no account on AWS (--no-sign-request); Copernicus Data Space needs registration"}
    attribution: "© DLR e.V. 2010-2014 and © Airbus Defence and Space GmbH 2014-2018 provided under COPERNICUS by the European Union and ESA; all rights reserved"
    use: [similarity, mask]
    coverage: "global land; some GLO-30 tiles not released publicly; acquisitions 2011 to 2015"
    resolution_spatial: 1 arc-second (about 30 m)
    resolution_effective: "not stated on page"
    resolution_temporal: "2011 to 2015 acquisitions"
    units: "m, EGM2008 heights"
    nature: derived
    uncertainty: "absolute vertical < 4 m (LE90); relative vertical < 2 m (slopes ≤ 20%) or < 4 m; absolute horizontal < 6 m (CE90)"
    limitations: "Surface model including buildings and vegetation; water and salt flats edited flat; maintained until 2026 per the page"
    dimensions: [topography]
    environments: [global-land]
    status: verified
    verified_on: "2026-11-18"
    verified_url: https://dataspace.copernicus.eu/explore-data/data-collections/copernicus-contributing-missions/collections-description/COP-DEM

