# Lunar data catalogue (task T10). Schema and checks: tools/catalog/catalog.py.
# Rule: a fact is written only if it was read on the page in verified_url on verified_on.
# "not stated on page" = the page read does not say it. "not verified" = the page could not be read.
# nature: measured (instrument observation), derived (gridded or processed from observations),
#         model (computed from a physical model), interpretation (maps or classifications by scientists).
# Environment ids: polar-highlands, psr, persistently-lit, mare-plains, pits-tubes, fresh-craters,
#                  degraded-highlands, global.
products:
  - id: lro-lola-ldem-85s-40m
    body: moon
    mission: LRO
    instrument: LOLA
    product: LDEM_85S_40M (polar gridded elevation, south)
    producer: LOLA Science Team, NASA GSFC
    url: https://pds-geosciences.wustl.edu/lro/lro-l-lola-3-rdr-v1/lrolol_1xxx/data/lola_gdr/polar/img/
    access: {format: PDS IMG, size: "not stated on page", licence: "PDS, free download", account: false}
    coverage: 85°S to 90°S
    resolution_spatial: 40 m
    resolution_effective: "coarser than 40 m away from the pole: grid interpolated between laser tracks (finding L3, not quantified)"
    resolution_temporal: "mission average"
    units: m
    nature: derived
    uncertainty: "not stated on page"
    limitations: "Interpolation between tracks; includes shadowed crater walls and floors"
    dimensions: [topography]
    environments: [polar-highlands, psr]
    status: verified
    verified_on: "2026-11-17"
    verified_url: https://pds-geosciences.wustl.edu/lro/lro-l-lola-3-rdr-v1/lrolol_1xxx/data/lola_gdr/polar/img/
    refresh:
      family: "pds"
      signal: "ETag and Last-Modified of the files used, and the LRO release table"
      interval: "weekly"
      cadence: "Most LRO instrument teams release data every three months; LROC releases data monthly."
      cadence_status: "verified"
      checked_url: "https://pds-geosciences.wustl.edu/missions/lro/"
      checked_on: "2026-11-23"
      watch: {"base": "https://pds-geosciences.wustl.edu/lro/lro-l-lola-3-rdr-v1/lrolol_1xxx/data/lola_gdr/polar/img/", "files": {"ldem_85s_40m.img": 115034112}}
    notes: "Downloaded and hashed by the project in v2 (SHA-256 in data/reference/moon-south-pole.json); 71,731 windows of 1 km"

