# Full local test (API + front end) before an Azure deployment.
#   docker compose up --build      then open http://localhost:8080
# The API scores the frozen data set data/dataset-v2.json (no live source call); rebuild it with tools/precompute/build_dataset.py.
services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: production
      PORT: "3001"
      FRONTEND_URL: http://localhost:8080
    ports:
      - "3001:3001"
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: http://localhost:3001
    environment:
      API_ORIGIN: http://localhost:3001
    ports:
      - "8080:80"
    depends_on:
      - api
