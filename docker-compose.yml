# Full local test (API + front end) before an Azure deployment.
#   docker compose up --build      then open http://localhost:8080
# The API queries the real sources (NASA POWER, USGS, GVP); slope, roughness and MODIS come from data/candidates-precomputed.json.
services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: production
      PORT: "3001"
      FRONTEND_URL: http://localhost:8080
    ports:
      - "3001:3001"
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: http://localhost:3001
    environment:
      API_ORIGIN: http://localhost:3001
    ports:
      - "8080:80"
    depends_on:
      - api
