# Full local test (API + front end + internal discovery service). Never deployed from here.
#   docker compose up --build      then open http://localhost:8080
# The v2 API scores the frozen data set data/dataset-v2.json (no live source call).
# v3 serves a release folder (tools/discovery/release.py). By default it is data/releases-fixture: SYNTHETIC TEST
# DATA for the end-to-end test, its run is named "synthetic-fixture". To see real results:
#   EARTHMOON_RELEASES=C:\Users\<you>\earthmoon-data\releases docker compose up --build
services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: production
      PORT: "3001"
      FRONTEND_URL: http://localhost:8080
      RELEASES_DIR: /data/releases
      DISCOVERY_URL: http://discovery:8000
    volumes:
      - ${EARTHMOON_RELEASES:-./data/releases-fixture}:/data/releases:ro
    ports:
      - "3001:3001"
    networks: [default, backend]
    depends_on:
      - discovery
  # Internal (ADR-005): no published port, no outbound network (internal network only), read-only data.
  discovery:
    build:
      context: .
      dockerfile: apps/discovery/Dockerfile
    volumes:
      - ${EARTHMOON_RELEASES:-./data/releases-fixture}:/data/releases:ro
    read_only: true
    networks: [backend]
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: http://localhost:3001
    environment:
      API_ORIGIN: http://localhost:3001
    ports:
      - "8080:80"
    depends_on:
      - api
  # T52 (ADR-009 section 5): watches the sources and writes freshness.json next to the releases. Off by default; start it
  # with the real data folder:  EARTHMOON_DATA=C:\Users\<you>\earthmoon-data docker compose --profile refresh up -d refresher
  # Credentials (CDS key, Earthdata login), when a watched source needs them: .env.refresher, never committed.
  refresher:
    profiles: [refresh]
    build:
      context: .
      dockerfile: apps/refresher/Dockerfile
    volumes:
      - ${EARTHMOON_DATA:-./.refresher-data-not-set}:/data
    env_file:
      - path: .env.refresher
        required: false
    read_only: true
    networks: [default]
    restart: unless-stopped
networks:
  backend:
    internal: true
