openapi: 3.0.3
info:
  title: Cyber&Space — Earth ↔ Moon analog sites API
  version: 0.1.0
  description: |
    Ranks Earth sites by how closely they resemble lunar conditions (docs/scenarios.md).
    Missing values (a source is down) are `null` and the criterion gets the verdict `missing`:
    a failing source never causes a global error.
    The scoring engine is in `apps/api/src/scoring/`, the source connectors in `apps/api/src/sources/`.
servers:
  - url: /
tags:
  - name: Analyse
  - name: Catalogue
  - name: Health
paths:
  /api/health:
    get:
      tags: [Health]
      summary: Health probe (Azure Container Apps)
      responses:
        "200":
          description: The API is up
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, example: ok }
  /api/modes:
    get:
      tags: [Catalogue]
      summary: Modes 1 to 3 and their predefined criteria
      description: "Mode 4 (free criteria) has no preset: use `criteria` on `POST /api/analyze`."
      responses:
        "200":
          description: List of modes
          content:
            application/json:
              schema:
                type: object
                required: [modes]
                properties:
                  modes:
                    type: array
                    items: { $ref: "#/components/schemas/Mode" }
  /api/parameters:
    get:
      tags: [Catalogue]
      summary: Parameter catalog (mode 4)
      responses:
        "200":
          description: Available parameters
          content:
            application/json:
              schema:
                type: object
                required: [parameters]
                properties:
                  parameters:
                    type: array
                    items: { $ref: "#/components/schemas/ParameterInfo" }
  /api/sources:
    get:
      tags: [Catalogue]
      summary: Data sources cited by the application
      description: All sources (Earth and Moon), with provider, URL and the attribution to reproduce. `valueSources` of `GET /api/sites/{id}` returns the `id` of these sources.
      responses:
        "200":
          description: Source catalog
          content:
            application/json:
              schema:
                type: object
                required: [sources]
                properties:
                  sources:
                    type: array
                    items: { $ref: "#/components/schemas/DataSource" }
  /api/reference/moon:
    get:
      tags: [Catalogue]
      summary: Lunar reference profile (data/reference/moon-south-pole.json)
      description: Shown on a site card to compare with Earth values. The score itself uses the mode criteria.
      responses:
        "200":
          description: Lunar profile (parameters with range, unit and source)
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "404":
          description: Profil indisponible
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/analyze:
    post:
      tags: [Analyse]
      summary: Rank the candidate sites for a mode or for free criteria
      description: |
        Send either `mode` (modes 1 to 3) or `criteria` (mode 4), never both.
        The "bare soil" filter (NDVI ≤ 0.2) is on by default: a vegetated site keeps `total` 0, carries
        `excluded: "vegetation"` and goes to the end of the list. The other sites are sorted by descending `total`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AnalyzeRequest" }
            examples:
              mode:
                summary: Predefined mode
                value: { mode: robotics }
              criteres_libres:
                summary: Mode 4, free criteria
                value:
                  criteria:
                    - { param: slope_mean, min: 5, max: 15, tolerance: 10, weight: 3 }
                    - { param: t2m_min, max: -20, tolerance: 20, weight: 1 }
                  bareSoilOnly: true
      responses:
        "200":
          description: Ranked sites
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AnalyzeResponse" }
              example:
                mode: robotics
                sites:
                  - id: haughton
                    name: Haughton Crater (Devon Island, Nunavut)
                    lat: 75.38
                    lon: -89.67
                    role: validation
                    total: 90
                    criteria:
                      - { param: slope_mean, value: 7.5, score: 1, verdict: match }
                      - { param: t2m_min, value: -48.55, score: 1, verdict: match }
                      - { param: volcano_distance, value: null, score: 0, verdict: missing }
        "400":
          description: Invalid request (unknown mode, malformed criterion, unreadable JSON body…)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "413":
          description: Corps trop volumineux
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429":
          description: Too many requests
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500":
          description: Erreur interne
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/sites/{id}:
    get:
      tags: [Analyse]
      summary: Detailed site card
      description: Same object as in `POST /api/analyze`, plus all raw values (`values`) and the sources queried.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, example: haughton }
        - name: mode
          in: query
          required: false
          description: Mode used to compute the displayed score (default `robotics`).
          schema: { $ref: "#/components/schemas/ModeId" }
      responses:
        "200":
          description: Site card
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SiteDetail" }
        "400":
          description: Unknown mode
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Unknown site
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
components:
  schemas:
    ParamId:
      type: string
      enum:
        - slope_mean
        - slope_max
        - roughness
        - elevation
        - ndvi
        - lst_day
        - lst_night
        - lst_amplitude
        - t2m_mean
        - t2m_min
        - t2m_max
        - wind
        - humidity
        - precipitation
        - solar
        - latitude_abs
        - quake_count
        - volcano_distance
    ModeId:
      type: string
      enum: [robotics, calibration, colony]
    Verdict:
      type: string
      description: "match: score ≥ 0.7 · partial: 0.4 to 0.7 · mismatch: < 0.4 · missing: no value"
      enum: [match, partial, mismatch, missing]
    Criterion:
      type: object
      description: Target interval [min, max]; score 1 inside, linear decrease to 0 at `tolerance` distance.
      required: [param, tolerance, weight]
      properties:
        param: { $ref: "#/components/schemas/ParamId" }
        min: { type: number }
        max: { type: number }
        tolerance: { type: number, minimum: 0 }
        weight: { type: number, exclusiveMinimum: true, minimum: 0 }
        group:
          type: string
          description: Instrument (mode 2) or need (mode 3), to filter and group in the interface.
    CriterionScore:
      type: object
      required: [param, value, score, verdict]
      properties:
        param: { $ref: "#/components/schemas/ParamId" }
        value: { type: number, nullable: true, description: "null = source indisponible" }
        score: { type: number, minimum: 0, maximum: 1 }
        verdict: { $ref: "#/components/schemas/Verdict" }
    Mode:
      type: object
      required: [id, name, criteria]
      properties:
        id: { $ref: "#/components/schemas/ModeId" }
        name: { type: string }
        criteria:
          type: array
          items: { $ref: "#/components/schemas/Criterion" }
    ParameterInfo:
      type: object
      required: [id, label, unit, source, lunar]
      properties:
        id: { $ref: "#/components/schemas/ParamId" }
        label: { type: string }
        unit: { type: string }
        source: { type: string, description: Source terrestre }
        lunar: { type: string, description: Équivalent lunaire }
    AnalyzeRequest:
      type: object
      description: Soit `mode`, soit `criteria`.
      properties:
        mode: { $ref: "#/components/schemas/ModeId" }
        criteria:
          type: array
          minItems: 1
          maxItems: 18
          description: "Mode 4: each parameter at most once; each criterion has min, max or both."
          items: { $ref: "#/components/schemas/Criterion" }
        bareSoilOnly:
          type: boolean
          default: true
          description: Bare-soil filter (NDVI ≤ 0.2). Can be disabled in mode 4.
      oneOf:
        - required: [mode]
        - required: [criteria]
    AnalyzedSite:
      type: object
      required: [id, name, lat, lon, role, total, criteria]
      properties:
        id: { type: string }
        name: { type: string }
        lat: { type: number }
        lon: { type: number }
        role:
          type: string
          enum: [validation, negative, candidate]
        total: { type: integer, minimum: 0, maximum: 100, description: Overall score out of 100 }
        criteria:
          type: array
          items: { $ref: "#/components/schemas/CriterionScore" }
        excluded:
          type: string
          enum: [vegetation]
          description: Present if the bare-soil filter excludes the site (total forced to 0).
    AnalyzeResponse:
      type: object
      required: [mode, sites]
      properties:
        mode:
          type: string
          enum: [robotics, calibration, colony, custom]
        sites:
          type: array
          items: { $ref: "#/components/schemas/AnalyzedSite" }
    SiteDetail:
      allOf:
        - $ref: "#/components/schemas/AnalyzedSite"
        - type: object
          required: [mode, values, sources, valueSources, moon]
          properties:
            terrain: { type: string }
            mode: { $ref: "#/components/schemas/ModeId" }
            values:
              type: object
              description: Raw values of all available parameters (null = source unavailable).
              additionalProperties:
                type: number
                nullable: true
            sources:
              type: array
              items: { type: string }
            valueSources:
              type: object
              description: "Source of each known value: catalog id from `GET /api/sources` (or `fixtures` in sample-data mode)."
              additionalProperties: { type: string }
            moon:
              type: object
              description: Lunar reference (data/reference/moon-south-pole.json) of each sourced parameter, whatever the mode. A parameter without a reference is absent.
              additionalProperties: { $ref: "#/components/schemas/MoonValue" }
    MoonValue:
      type: object
      properties:
        min: { type: number }
        max: { type: number }
        unit: { type: string }
        source: { type: string }
    DataSource:
      type: object
      required: [id, name, provider, url, body, params, terms]
      properties:
        id: { type: string, example: nasa-power }
        name: { type: string }
        provider: { type: string }
        url: { type: string }
        body: { type: string, enum: [earth, moon] }
        params:
          type: array
          items: { $ref: "#/components/schemas/ParamId" }
        terms: { type: string }
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
