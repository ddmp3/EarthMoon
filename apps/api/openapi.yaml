openapi: 3.0.3
info:
  title: Cyber&Space — Earth ↔ Moon analog sites API
  version: 0.1.0
  description: |
    Ranks Earth sites by how closely they resemble lunar conditions (docs/METHOD.md).
    Missing values (a source is down) are `null` and the criterion gets the verdict `missing`:
    a failing source never causes a global error.
    The scoring engine is in `apps/api/src/scoring/`, the source connectors in `apps/api/src/sources/`.
servers:
  - url: /
tags:
  - name: V3
    description: Discovery results of v3, served from static releases (ADR-004)
  - name: Analyse
  - name: Catalogue
  - name: Health
paths:
  /api/health:
    get:
      tags: [Health]
      summary: Health probe (Azure Container Apps)
      responses:
        "200":
          description: The API is up
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, example: ok }
  /api/modes:
    get:
      tags: [Catalogue]
      summary: Modes 1 to 3 and their predefined criteria
      description: "Mode 4 (free criteria) has no preset: use `criteria` on `POST /api/analyze`."
      responses:
        "200":
          description: List of modes
          content:
            application/json:
              schema:
                type: object
                required: [modes]
                properties:
                  modes:
                    type: array
                    items: { $ref: "#/components/schemas/Mode" }
  /api/parameters:
    get:
      tags: [Catalogue]
      summary: Parameter catalog (mode 4)
      responses:
        "200":
          description: Available parameters
          content:
            application/json:
              schema:
                type: object
                required: [parameters]
                properties:
                  parameters:
                    type: array
                    items: { $ref: "#/components/schemas/ParameterInfo" }
  /api/sources:
    get:
      tags: [Catalogue]
      summary: Data sources cited by the application
      description: All sources (Earth and Moon), with provider, URL and the attribution to reproduce. `valueSources` of `GET /api/sites/{id}` returns the `id` of these sources.
      responses:
        "200":
          description: Source catalog
          content:
            application/json:
              schema:
                type: object
                required: [sources]
                properties:
                  sources:
                    type: array
                    items: { $ref: "#/components/schemas/DataSource" }
  /api/reference/moon:
    get:
      tags: [Catalogue]
      summary: Lunar reference profile (data/reference/moon-south-pole.json)
      description: Shown on a site card to compare with Earth values. The score itself uses the mode criteria.
      responses:
        "200":
          description: Lunar profile (parameters with range, unit and source)
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "404":
          description: Profil indisponible
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/analyze:
    post:
      tags: [Analyse]
      summary: Rank the candidate sites for a mode or for free criteria
      description: |
        Send either `mode` (modes 1 to 3) or `criteria` (mode 4), never both.
        The "bare soil" filter (NDVI ≤ 0.2) is on by default: a vegetated site keeps `total` 0, carries
        `excluded: "vegetation"` and goes to the end of the list. The other sites are sorted by descending `total`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AnalyzeRequest" }
            examples:
              mode:
                summary: Predefined mode
                value: { mode: robotics }
              criteres_libres:
                summary: Mode 4, free criteria
                value:
                  criteria:
                    - { param: slope_mean, min: 5, max: 15, tolerance: 10, weight: 3 }
                    - { param: t2m_min, max: -20, tolerance: 20, weight: 1 }
                  bareSoilOnly: true
      responses:
        "200":
          description: Ranked sites
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AnalyzeResponse" }
              example:
                mode: robotics
                sites:
                  - id: haughton
                    name: Haughton Crater (Devon Island, Nunavut)
                    lat: 75.38
                    lon: -89.67
                    role: validation
                    total: 90
                    criteria:
                      - { param: slope_mean, value: 7.5, score: 1, verdict: match }
                      - { param: t2m_min, value: -48.55, score: 1, verdict: match }
                      - { param: volcano_distance, value: null, score: 0, verdict: missing }
        "400":
          description: Invalid request (unknown mode, malformed criterion, unreadable JSON body…)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "413":
          description: Corps trop volumineux
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429":
          description: Too many requests
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500":
          description: Erreur interne
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/sites/{id}:
    get:
      tags: [Analyse]
      summary: Detailed site card
      description: Same object as in `POST /api/analyze`, plus all raw values (`values`) and the sources queried.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, example: haughton }
        - name: mode
          in: query
          required: false
          description: Mode used to compute the displayed score (default `robotics`).
          schema: { $ref: "#/components/schemas/ModeId" }
      responses:
        "200":
          description: Site card
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SiteDetail" }
        "400":
          description: Unknown mode
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Unknown site
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/v3/releases:
    get:
      tags: [V3]
      summary: Current release and the last 3 (ADR-009)
      responses:
        "200":
          description: Release index
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReleaseIndex" }
        "503": { $ref: "#/components/responses/NoRelease" }
  /api/v3/releases/{id}:
    get:
      tags: [V3]
      summary: One release with its run, protocol, commit, processing chain, validation and grid
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, pattern: "^r-[0-9a-f]{8}$" } }
      responses:
        "200":
          description: Release manifest
          content:
            application/json:
              schema: { $ref: "#/components/schemas/V3Doc" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/NoRelease" }
  /api/v3/profiles:
    get:
      tags: [V3]
      summary: Lunar environment profiles (specs and computed distributions)
      parameters: [{ $ref: "#/components/parameters/Release" }]
      responses:
        "200":
          description: Profiles
          content:
            application/json:
              schema: { $ref: "#/components/schemas/V3Doc" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/NoRelease" }
  /api/v3/profiles/{id}:
    get:
      tags: [V3]
      summary: One lunar environment profile
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { $ref: "#/components/parameters/Release" }
      responses:
        "200":
          description: Profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/V3Doc" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/NoRelease" }
  /api/v3/scenarios:
    get:
      tags: [V3]
      summary: Scenarios with their targets, requirements, suitability and what they cannot assess
      parameters: [{ $ref: "#/components/parameters/Release" }]
      responses:
        "200":
          description: Scenarios
          content:
            application/json:
              schema: { $ref: "#/components/schemas/V3Doc" }
        "503": { $ref: "#/components/responses/NoRelease" }
  /api/v3/scenarios/{id}:
    get:
      tags: [V3]
      summary: One scenario
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { $ref: "#/components/parameters/Release" }
      responses:
        "200":
          description: Scenario
          content:
            application/json:
              schema: { $ref: "#/components/schemas/V3Doc" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/NoRelease" }
  /api/v3/zones:
    get:
      tags: [V3]
      summary: Candidate zones of one scenario and target, ranked, for one value of the sensitivity grid
      description: >-
        `tau` and `min_cells` accept only the values of the release grid (`/api/v3/releases/{id}`, `grid`);
        without them the nominal values are used. A grid value that was not exported is 404, never an empty list.
        A target with no Earth assessment (for example a 5 m lunar window) is 400 with the reason.
      parameters:
        - { $ref: "#/components/parameters/Scenario" }
        - { $ref: "#/components/parameters/Env" }
        - { name: tau, in: query, schema: { type: number } }
        - { name: min_cells, in: query, description: "Minimum zone size in 5 km cells", schema: { type: integer } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { $ref: "#/components/parameters/Release" }
      responses:
        "200":
          description: One page of zones
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ZonePage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/NoRelease" }
  /api/v3/zones/{id}:
    get:
      tags: [V3]
      summary: Zone card, with spread, requirements, coverage of its cells, Monte Carlo and what Earth cannot reproduce
      parameters:
        - { name: id, in: path, required: true, description: "For example B.moon-psr.t0.5.m3.12", schema: { type: string } }
        - { $ref: "#/components/parameters/Release" }
      responses:
        "200":
          description: Zone
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ZoneDetail" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/NoRelease" }
  /api/v3/coverage:
    get:
      tags: [V3]
      summary: Share of land in each coverage overlay class for one scenario and target
      parameters:
        - { $ref: "#/components/parameters/Scenario" }
        - { $ref: "#/components/parameters/Env" }
        - { $ref: "#/components/parameters/Release" }
      responses:
        "200":
          description: Coverage shares
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Coverage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/NoRelease" }
  /api/v3/layers/{scenario}/{env}/{parameter}/{z}/{x}/{y}.png:
    get:
      tags: [V3]
      summary: Raster map tile (zoom 0 to 7) of one target - typicality, or the coverage overlay
      description: >-
        Pixels show the 5 km cell that holds their centre. Typicality tiles draw the states (value colour, pastel
        hatching on partial cells, grey dots where nothing was evaluated, an outline where the ground is hidden);
        coverage tiles are transparent on evaluated cells and patterned elsewhere. A tile with no cell is 204.
        Rate limit ten times the general one.
      parameters:
        - { name: scenario, in: path, required: true, schema: { type: string } }
        - { name: env, in: path, required: true, schema: { type: string } }
        - { name: parameter, in: path, required: true, schema: { type: string, enum: [typicality, coverage, geology, frozen, aridity] } }
        - { name: z, in: path, required: true, schema: { type: integer, minimum: 0, maximum: 7 } }
        - { name: x, in: path, required: true, schema: { type: integer, minimum: 0 } }
        - { name: y, in: path, required: true, schema: { type: integer, minimum: 0 } }
        - { $ref: "#/components/parameters/Release" }
      responses:
        "200":
          description: PNG tile (256 x 256, RGBA)
          content:
            image/png:
              schema: { type: string, format: binary }
        "204": { description: No cell in this tile }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/NoRelease" }
  /api/v3/cells:
    get:
      tags: [V3]
      summary: Cells in view (zoom 8 and above) as GeoJSON polygons, at most 5,000
      description: >-
        Computed by the internal discovery service over the release's cells (ADR-005). Each cell carries its
        typicality with spread, its windows, coverage class, confidence, masked share and requirement states.
        503 when the service is unavailable (the preset layers and zones keep working).
      parameters:
        - { $ref: "#/components/parameters/Scenario" }
        - { $ref: "#/components/parameters/Env" }
        - { name: bbox, in: query, required: true, description: "west,south,east,north in degrees", schema: { type: string, example: "20,10,20.5,10.5" } }
        - { $ref: "#/components/parameters/Release" }
      responses:
        "200":
          description: GeoJSON FeatureCollection, with release and methodology_version
          content:
            application/json:
              schema: { $ref: "#/components/schemas/V3Doc" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/NoRelease" }
  /api/v3/query:
    post:
      tags: [V3]
      summary: Custom criteria over the precomputed cells (ADR-003 limits)
      description: >-
        Never calls an external source. Unknown fields are refused; the body is limited to 16 KB, the area to
        1,000,000 cells and the time to 30 s. At most `limit` cells are returned, all are counted.
      parameters: [{ $ref: "#/components/parameters/Release" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [scenario, env]
              properties:
                scenario: { type: string, example: B }
                env: { type: string, example: moon-psr }
                min_typicality: { type: number, minimum: 0, maximum: 1, default: 0 }
                min_confidence: { type: string, enum: [low, medium, high], default: low }
                requirements_met:
                  type: array
                  items: { type: string, enum: [base_slope, climbing_limit_lrv, climbing_limit_viper] }
                bbox: { type: array, items: { type: number }, minItems: 4, maxItems: 4, description: "west, south, east, north" }
                limit: { type: integer, minimum: 1, maximum: 500, default: 100 }
      responses:
        "200":
          description: Matching cells, ranked by typicality, with the criteria, count and area
          content:
            application/json:
              schema: { $ref: "#/components/schemas/V3Doc" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "413": { $ref: "#/components/responses/BadRequest" }
        "503": { $ref: "#/components/responses/NoRelease" }
  /api/v3/method:
    get:
      tags: [V3]
      summary: Data and method panel - sources from the catalogues with their status, and the processing chain
      parameters: [{ $ref: "#/components/parameters/Release" }]
      responses:
        "200":
          description: Sources and processing
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Method" }
        "503": { $ref: "#/components/responses/NoRelease" }
  /api/v3/status:
    get:
      tags: [V3]
      summary: Validity of the release and freshness of its sources (ADR-009)
      description: Validated only when every check of the validation protocol passes. Freshness comes from the refresher (T52) when it has run; otherwise each source is `not_checkable`, with the date it was verified by hand. A source whose last check is older than twice its interval, or never checked, is `check_overdue`. An older release names the newer one in `newer_release`.
      parameters: [{ $ref: "#/components/parameters/Release" }]
      responses:
        "200":
          description: Validity and freshness
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Status" }
        "503": { $ref: "#/components/responses/NoRelease" }
  /api/v3/changes:
    get:
      tags: [V3]
      summary: What changed from the previous release of the same body (T52)
      description: Source events, Earth tiles recomputed, added or withdrawn, source files whose version changed, and the publication decision with its reasons (null until decided).
      parameters: [{ $ref: "#/components/parameters/Release" }]
      responses:
        "200":
          description: Changes of the release
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Changes" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/NoRelease" }
  /api/v3/tiles/{tile}/provenance:
    get:
      tags: [V3]
      summary: Provenance of one 1 degree Earth tile (T52)
      description: For each scale, the source files read (with their version and date at the source), when the tile was computed, the code version and commit, and the release where it last changed. A tile computed before T52 has computed_at null and says so.
      parameters:
        - { $ref: "#/components/parameters/Release" }
        - { name: tile, in: path, required: true, schema: { type: string, pattern: '^-?\d{1,2},-?\d{1,3}$' }, description: "lat,lon of the south-west corner, for example 10,20" }
      responses:
        "200":
          description: Provenance of the tile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TileProvenance" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/NoRelease" }
  /api/v3/analogs/target:
    get:
      tags: [V3]
      summary: Planetary windows of a target with their IAU names, for the globe (T45c)
      description: A seeded sample of the target's windows (at most 4,000), each with its centre, slope and the name of the IAU feature that holds it (or the nearest one). Built by tools/discovery/analogs.py; 404 when the release has none.
      parameters:
        - { $ref: "#/components/parameters/Release" }
        - { name: scenario, in: query, required: true, schema: { type: string } }
        - { name: env, in: query, required: true, schema: { type: string } }
      responses:
        "200": { description: Windows of the target, content: { application/json: { schema: { $ref: "#/components/schemas/V3Doc" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v3/analogs/zone/{id}:
    get:
      tags: [V3]
      summary: Planetary windows of the same slope as an Earth zone (T45c)
      description: "Windows of the zone's target whose slope percentile is within 2.5 points of the zone's median slope percentile. Our method compares a zone with an environment, never with one planetary place: this is the link shown between the two globes. Only the best zones of each target are linked."
      parameters:
        - { $ref: "#/components/parameters/Release" }
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Same-slope windows, content: { application/json: { schema: { $ref: "#/components/schemas/V3Doc" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v3/analogs/point:
    get:
      tags: [V3]
      summary: Earth zones of the same slope as a planetary point (T45c)
      description: The nearest stored window of the target to the point, then the linked Earth zones whose median slope percentile is within 2.5 points of it, best typicality first (at most 20).
      parameters:
        - { $ref: "#/components/parameters/Release" }
        - { name: scenario, in: query, required: true, schema: { type: string } }
        - { name: env, in: query, required: true, schema: { type: string } }
        - { name: lat, in: query, required: true, schema: { type: number, minimum: -90, maximum: 90 } }
        - { name: lon, in: query, required: true, schema: { type: number, minimum: -360, maximum: 360 } }
      responses:
        "200": { description: Same-slope Earth zones, content: { application/json: { schema: { $ref: "#/components/schemas/V3Doc" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v3/sites:
    get:
      tags: [V3]
      summary: Values of the cell holding each known site of the missions, for every environment of the scenario
      description: Forwarded to the internal discovery service (ADR-005). A site whose place was not assessed has cell null and the reason.
      parameters:
        - { $ref: "#/components/parameters/Release" }
        - { $ref: "#/components/parameters/Scenario" }
      responses:
        "200":
          description: One entry per known site
          content:
            application/json:
              schema: { $ref: "#/components/schemas/V3Doc" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/NoRelease" }
components:
  parameters:
    Release:
      name: release
      in: query
      description: A release id listed by /api/v3/releases, or a body name (moon, mars) for that body's current release (default the current lunar one)
      schema: { type: string }
    Scenario:
      name: scenario
      in: query
      required: true
      schema: { type: string, example: B }
    Env:
      name: env
      in: query
      required: true
      description: Lunar target environment of the scenario
      schema: { type: string, example: moon-psr }
  responses:
    BadRequest:
      description: Invalid query
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Unknown id, or not exported in this release
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NoRelease:
      description: No v3 release installed on this server
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    V3Doc:
      type: object
      description: Every v3 response carries the release and the methodology version.
      required: [release, methodology_version]
      additionalProperties: true
      properties:
        release: { type: string, example: r-0a1b2c3d }
        methodology_version: { type: string, example: v3 }
    ReleaseIndex:
      type: object
      required: [current, releases]
      properties:
        current: { type: string, description: The default release (lunar) }
        current_by_body:
          type: object
          description: The current release of each body (moon, mars); a body name is accepted wherever a release id is
          additionalProperties: { type: string }
        releases:
          type: array
          items:
            type: object
            required: [id, run, methodology_version, protocol, commit, created]
            properties:
              id: { type: string }
              run: { type: string }
              methodology_version: { type: string }
              protocol: { type: string }
              commit: { type: string }
              created: { type: string }
              body: { type: string, description: moon or mars (absent for releases made before T48, which are lunar) }
    Spread:
      type: object
      required: [median, p25, p75]
      properties:
        median: { type: number }
        p25: { type: number }
        p75: { type: number }
    Zone:
      type: object
      required: [id, rank, scenario, target, lat, lon, cells, area_km2, typicality, high_confidence_share, requirements, coverage, monte_carlo]
      properties:
        id: { type: string }
        rank: { type: integer }
        scenario: { type: string }
        target: { type: string }
        lat: { type: number }
        lon: { type: number }
        place:
          type: object
          nullable: true
          description: "place name of the zone centre (OpenStreetMap Nominatim, ODbL), in English and French; only the best zones of each target have one (T45c)"
          properties:
            en: { type: string, nullable: true }
            fr: { type: string, nullable: true }
        slope_median: { type: number, nullable: true, description: "median slope (degrees) of the zone's unmasked windows, for the same-slope link (T45c)" }
        cells: { type: integer }
        area_km2: { type: number }
        typicality: { $ref: "#/components/schemas/Spread" }
        high_confidence_share: { type: number }
        requirements:
          type: object
          additionalProperties:
            type: object
            properties:
              met: { type: integer }
              failed: { type: integer }
              unknown: { type: integer }
        suitability_median: { type: number, nullable: true }
        coverage:
          type: object
          required: [windows, valid_unmasked, cover_unknown, cells_by_confidence]
          properties:
            windows: { type: integer }
            valid_unmasked: { type: integer }
            cover_unknown: { type: integer }
            cells_by_confidence:
              type: object
              properties:
                high: { type: integer }
                medium: { type: integer }
                low: { type: integer }
        monte_carlo:
          type: object
          nullable: true
          description: null when the Monte Carlo was not run for this grid value (only the nominal value is run)
          properties:
            top_decile_share: { type: number }
        tiles: { type: array, items: { type: string } }
        context:
          type: object
          nullable: true
          description: "T47, decision E18: Earth context of the zone's cells (models, never a similarity with the Moon): share per frozen-ground state (E4) and per aridity class. null when the release has no context."
          properties:
            class: { type: string, enum: [model] }
            comparable_with_moon: { type: boolean }
            frozen_e4: { type: object, additionalProperties: { type: number } }
            magt_c_median: { type: number, nullable: true }
            aridity: { type: object, additionalProperties: { type: number } }
            sources: { type: array, items: { type: string } }
        geology:
          type: object
          nullable: true
          description: "T46: mean share of the 9 samples of the zone's cells in each geology state, for the group of lunar environments of the target (crosswalk E17). null when the release has no geology."
          properties:
            group: { type: string, enum: [highland, mare, pits] }
            source: { type: string }
            match: { type: number }
            partial: { type: number }
            no_match: { type: number }
            unresolved: { type: number }
            no_map: { type: number }
    ZonePage:
      allOf:
        - $ref: "#/components/schemas/V3Doc"
        - type: object
          required: [scenario, env, tau, min_cells, total, offset, limit, zones]
          properties:
            scenario: { type: string }
            env: { type: string }
            tau: { type: number }
            min_cells: { type: integer }
            total: { type: integer }
            offset: { type: integer }
            limit: { type: integer }
            zones: { type: array, items: { $ref: "#/components/schemas/Zone" } }
    ZoneDetail:
      allOf:
        - $ref: "#/components/schemas/V3Doc"
        - type: object
          required: [zone, cannot_assess]
          properties:
            zone: { $ref: "#/components/schemas/Zone" }
            cannot_assess: { type: array, items: { type: string } }
    CoverageClass:
      type: object
      required: [km2, share, meaning]
      properties:
        km2: { type: number }
        share: { type: number, nullable: true }
        meaning: { type: string }
    Coverage:
      allOf:
        - $ref: "#/components/schemas/V3Doc"
        - type: object
          required: [scenario, env, coverage]
          properties:
            scenario: { type: string }
            env: { type: string }
            coverage:
              type: object
              required: [land_km2, classes]
              properties:
                land_km2: { type: number }
                classes:
                  type: object
                  description: screened_out, no_data, ground_hidden, partial, low_confidence, evaluated
                  additionalProperties: { $ref: "#/components/schemas/CoverageClass" }
    Status:
      allOf:
        - $ref: "#/components/schemas/V3Doc"
        - type: object
          required: [validity, freshness]
          properties:
            validity:
              type: object
              required: [state, protocol, release, published, checks]
              properties:
                state: { type: string, enum: [validated, not_validated] }
                protocol: { type: string }
                release: { type: string }
                published: { type: string }
                checks:
                  type: array
                  items:
                    type: object
                    required: [check, pass, detail]
                    properties:
                      check: { type: string }
                      pass: { type: boolean, nullable: true, description: "null when the check cannot run" }
                      detail: { type: string }
            freshness:
              type: object
              required: [refresher, sources]
              properties:
                refresher: { type: boolean, description: "true when the freshness comes from the automatic refresher (T52)" }
                note: { type: string }
                written_at: { type: string, description: "when the refresher last wrote its state" }
                newer_release: { type: string, description: "the current release of the same body, when this one is older" }
                held:
                  type: array
                  description: refreshed releases waiting for review, with the reasons they were not published
                  items:
                    type: object
                    required: [id]
                    properties:
                      id: { type: string }
                      body: { type: string }
                      reasons: { type: array, items: { type: string } }
                progress: { type: object, nullable: true, additionalProperties: true, description: "step and share of a running recompute" }
                impact:
                  type: array
                  description: pre-analysis of each detected update (T52b) - what it would recompute and the estimated CPU time; no recompute is started
                  items:
                    type: object
                    required: [source, kind, tiles_changed, releases, cpu_hours_estimate, basis, recompute_started]
                    properties:
                      source: { type: string }
                      kind: { type: string, enum: [earth_tiles, earth_global, earth_context, planetary] }
                      items: { type: integer }
                      tiles_changed: { type: array, items: { type: string } }
                      tiles_reassessed: { type: integer }
                      releases:
                        type: array
                        items:
                          type: object
                          properties:
                            release: { type: string }
                            body: { type: string }
                            targets: { type: array, items: { type: string } }
                            tiles_reassessed: { type: integer }
                            cells_estimate: { type: integer }
                            earth_features: { type: boolean }
                            context: { type: boolean }
                            cpu_seconds_estimate: { type: number, nullable: true }
                      cpu_hours_estimate: { type: number, nullable: true, description: "null when a step was never calibrated" }
                      basis: { type: string }
                      recompute_started: { type: boolean }
                new_products:
                  type: array
                  description: new planetary products seen in a release table, logged "detected, to verify"; never used in a run before a new protocol version
                  items:
                    type: object
                    required: [source, found, detected_on, status, url]
                    properties:
                      source: { type: string }
                      found: { type: string }
                      detected_on: { type: string }
                      status: { type: string }
                      url: { type: string }
                sources:
                  type: array
                  items:
                    type: object
                    required: [id, state, checked_on]
                    properties:
                      id: { type: string }
                      state:
                        type: string
                        enum: [up_to_date, first_check, update_detected, update_in_progress, update_held, check_failed, check_overdue, not_checkable]
                        description: "first_check: signal recorded, changes since ingest unknown; update_detected: a change waits for a recompute"
                      checked_on: { type: string, nullable: true, description: "last check (refresher) or hand verification" }
                      last_success: { type: string, nullable: true }
                      detected_on: { type: string, nullable: true }
                      reason: { type: string, nullable: true }
    Changes:
      allOf:
        - $ref: "#/components/schemas/V3Doc"
        - type: object
          required: [previous, events, tiles_recomputed, tiles_added, tiles_withdrawn, source_items_changed, decision]
          properties:
            previous: { type: string, nullable: true }
            events: { type: array, items: { type: object, additionalProperties: true } }
            tiles_recomputed: { type: array, items: { type: string } }
            tiles_added: { type: array, items: { type: string } }
            tiles_withdrawn: { type: array, items: { type: string } }
            source_items_changed: { type: array, items: { type: string } }
            decision:
              type: object
              nullable: true
              properties:
                publish: { type: boolean }
                reasons: { type: array, items: { type: string } }
    TileProvenance:
      allOf:
        - $ref: "#/components/schemas/V3Doc"
        - type: object
          required: [tile, last_changed_in, data_date, scales]
          properties:
            tile: { type: string }
            last_changed_in: { type: string }
            data_date: { type: string, nullable: true, description: "latest source file date at the source (YYYY-MM-DD)" }
            scales:
              type: object
              additionalProperties:
                type: object
                required: [computed_at, code, inputs]
                properties:
                  computed_at: { type: string, nullable: true }
                  computed_at_note: { type: string }
                  code: { type: string }
                  commit: { type: string }
                  outputs: { type: string, description: "sha256 of the tile windows file" }
                  inputs:
                    type: array
                    items:
                      type: object
                      required: [item]
                      properties:
                        item: { type: string }
                        etag: { type: string, nullable: true }
                        size: { type: integer, nullable: true }
                        last_modified: { type: string, nullable: true }
                        sha256: { type: string, nullable: true }
    Method:
      allOf:
        - $ref: "#/components/schemas/V3Doc"
        - type: object
          required: [sources, processing]
          properties:
            sources:
              type: array
              items:
                type: object
                required: [id, status]
                additionalProperties: true
                properties:
                  id: { type: string }
                  status: { type: string, description: "catalogue status, or 'not in catalogue'" }
                  verified_on: { type: string, nullable: true }
            processing: { type: array, items: { type: object, additionalProperties: true } }
    ParamId:
      type: string
      enum:
        - slope_mean
        - slope_max
        - roughness
        - elevation
        - ndvi
        - lst_day
        - lst_night
        - lst_amplitude
        - t2m_mean
        - t2m_min
        - t2m_max
        - wind
        - humidity
        - precipitation
        - solar
        - latitude_abs
        - quake_count
        - volcano_distance
        - slope_p95
        - roughness_detrended
        - traversable_15
        - traversable_20
        - traversable_25
        - specific_humidity
        - quake_m45_count
        - lava_tube_evidence
    ModeId:
      type: string
      enum: [robotics, calibration, colony]
    Verdict:
      type: string
      description: "match: score ≥ 0.7 · partial: 0.4 to 0.7 · mismatch: < 0.4 · missing: no value"
      enum: [match, partial, mismatch, missing]
    Criterion:
      type: object
      description: >-
        Target interval [min, max]; score 1 inside, linear decrease to 0 at `tolerance` distance
        (`toleranceBelow` / `toleranceAbove` when the two sides differ).
      required: [param, tolerance, weight]
      properties:
        param: { $ref: "#/components/schemas/ParamId" }
        min: { type: number }
        max: { type: number }
        tolerance: { type: number, minimum: 0 }
        toleranceBelow: { type: number, minimum: 0, description: "Tolerance below `min`, if different from `tolerance`." }
        toleranceAbove: { type: number, minimum: 0, description: "Tolerance above `max`, if different from `tolerance`." }
        weight: { type: number, exclusiveMinimum: 0, minimum: 0 }
        required:
          type: boolean
          description: Hard requirement. A site scoring 0 on it fails the scenario and ranks after every site that passes; it is never averaged away.
        group:
          type: string
          description: Instrument (mode 2) or need (mode 3), to filter and group in the interface.
        role:
          type: string
          enum: [similarity, requirement, proxy]
          description: "similarity: compared with a measured lunar distribution · requirement: operational need of the vehicle, instrument or mission · proxy: indirect Earth indicator of a lunar condition."
        basis:
          type: string
          enum: [lunar_measurement, mission_requirement, expert_judgement]
          description: Where the interval and tolerance come from.
        rationale: { type: string, description: Why the criterion is there and where its numbers come from. }
    CriterionScore:
      type: object
      required: [param, value, score, verdict, contribution, maxContribution]
      properties:
        param: { $ref: "#/components/schemas/ParamId" }
        value: { type: number, nullable: true, description: "null = no measurement" }
        score: { type: number, minimum: 0, maximum: 1 }
        verdict: { $ref: "#/components/schemas/Verdict" }
        contribution: { type: number, minimum: 0, description: "Points (out of 100) this criterion adds to the total; 0 when missing." }
        maxContribution: { type: number, minimum: 0, description: "Points this criterion could add at most, given the criteria that have data." }
        sigma: { type: number, minimum: 0, description: "1-sigma uncertainty of the value, when quantified." }
        flags:
          type: array
          items: { type: string }
          description: Data-quality flags of the value (for example large_elevation_correction, seasonal_gaps, flat_artifact).
        required: { type: boolean, description: Present (true) on hard requirements. }
    Mode:
      type: object
      required: [id, name, target, criteria]
      properties:
        id: { $ref: "#/components/schemas/ModeId" }
        name: { type: string }
        target: { type: string, description: Lunar environment the scenario targets. }
        criteria:
          type: array
          items: { $ref: "#/components/schemas/Criterion" }
    ParameterInfo:
      type: object
      required: [id, label, unit, source, lunar]
      properties:
        id: { $ref: "#/components/schemas/ParamId" }
        label: { type: string }
        unit: { type: string }
        source: { type: string, description: Source terrestre }
        lunar: { type: string, description: Équivalent lunaire }
    AnalyzeRequest:
      type: object
      description: Soit `mode`, soit `criteria`.
      properties:
        mode: { $ref: "#/components/schemas/ModeId" }
        criteria:
          type: array
          minItems: 1
          maxItems: 26
          description: "Mode 4: each parameter at most once; each criterion has min, max or both."
          items: { $ref: "#/components/schemas/Criterion" }
        bareSoilOnly:
          type: boolean
          default: true
          description: Bare-soil filter. No penalty up to NDVI 0.2, linear penalty down to 0 at NDVI 0.6 (excluded). Can be disabled in mode 4.
      oneOf:
        - required: [mode]
        - required: [criteria]
    AnalyzedSite:
      type: object
      required: [id, name, lat, lon, role, total, criteria, coverage, totalRange, requirements]
      properties:
        id: { type: string }
        name: { type: string }
        lat: { type: number }
        lon: { type: number }
        role:
          type: string
          enum: [validation, negative, candidate]
        total: { type: integer, minimum: 0, maximum: 100, description: Overall score out of 100 }
        criteria:
          type: array
          items: { $ref: "#/components/schemas/CriterionScore" }
        excluded:
          type: string
          enum: [vegetation]
          description: Present if the bare-soil filter excludes the site (dense vegetation, NDVI ≥ 0.6; total forced to 0).
        vegetationFactor:
          type: number
          exclusiveMinimum: 0
          maximum: 1
          description: Present if the bare-soil filter lowered the total (NDVI between 0.2 and 0.6). The total is multiplied by this factor.
        stability:
          $ref: "#/components/schemas/Stability"
        coverage: { type: number, minimum: 0, maximum: 1, description: "Share of the criteria weight that has data. A missing value counts neither for nor against the site." }
        totalRange:
          type: object
          description: Total if every missing criterion scored 0 (min) and if it scored 1 (max). Equal to the total when nothing is missing.
          required: [min, max]
          properties:
            min: { type: integer, minimum: 0, maximum: 100 }
            max: { type: integer, minimum: 0, maximum: 100 }
        requirements:
          type: string
          enum: [met, failed, unknown]
          description: "Hard requirements of the scenario. failed: the site ranks after every site that passes · unknown: a required criterion has no data."
        failedRequirements:
          type: array
          items: { $ref: "#/components/schemas/ParamId" }
        missing:
          type: array
          items: { $ref: "#/components/schemas/ParamId" }
          description: Criteria with no data for this site.
        confidence:
          type: string
          enum: [high, medium, low]
          description: >-
            Confidence in the assessment, separate from the score. low: coverage under 0.6, a required criterion
            without data, or a 10th to 90th percentile interval of the total wider than 30 points. high: coverage of 0.9
            or more and an interval of 15 points or less. Absent for excluded sites.
    Stability:
      type: object
      description: Rank and total of the site when weights, tolerances, interval bounds and the site values (within their uncertainty) are perturbed (see AnalyzeResponse.sensitivity). Absent for excluded sites.
      required: [rankP10, rankMedian, rankP90, topHalfShare, totalP10, totalP90, requirementsShare]
      properties:
        rankP10: { type: integer, minimum: 1, description: "Best-case rank (10th percentile of the scenarios)." }
        rankMedian: { type: integer, minimum: 1 }
        rankP90: { type: integer, minimum: 1, description: "Worst-case rank (90th percentile of the scenarios)." }
        topHalfShare: { type: number, minimum: 0, maximum: 1, description: Share of scenarios where the site stays in the top half of the ranked sites. }
        totalP10: { type: number, minimum: 0, maximum: 100, description: 10th percentile of the total over the scenarios. }
        totalP90: { type: number, minimum: 0, maximum: 100, description: 90th percentile of the total over the scenarios. }
        requirementsShare: { type: number, minimum: 0, maximum: 1, description: Share of scenarios where the site meets every hard requirement. }
    Methodology:
      type: object
      description: Versions needed to reproduce a result.
      required: [version]
      properties:
        version: { type: string, description: Version of the scoring method (docs/METHOD.md). }
        dataset: { type: string, description: Version of the frozen data set (data/dataset-v2.json). Absent when sources are read live. }
    ExplainedCriterion:
      type: object
      required: [param, contribution, loss]
      properties:
        param: { $ref: "#/components/schemas/ParamId" }
        contribution: { type: number, description: Points added to the total. }
        loss: { type: number, description: Points lost compared with a perfect score on this criterion. }
        role: { type: string }
        basis: { type: string }
        rationale: { type: string }
    Explanation:
      type: object
      description: Why the site gets its result. Orders what the assessment already contains; adds no information.
      required: [strengths, weaknesses, decisive, missing, flagged, expertShare]
      properties:
        strengths:
          type: array
          items: { $ref: "#/components/schemas/ExplainedCriterion" }
        weaknesses:
          type: array
          items: { $ref: "#/components/schemas/ExplainedCriterion" }
        decisive:
          type: array
          items: { $ref: "#/components/schemas/ParamId" }
          description: Required criteria the site fails.
        missing:
          type: array
          items: { $ref: "#/components/schemas/ParamId" }
        flagged:
          type: array
          items:
            type: object
            required: [param, flags]
            properties:
              param: { $ref: "#/components/schemas/ParamId" }
              flags:
                type: array
                items: { type: string }
        expertShare: { type: number, minimum: 0, maximum: 1, description: Share of the total resting on criteria whose numbers are expert judgements rather than measurements. }
    Sensitivity:
      type: object
      description: How the stability of the ranks was computed.
      required: [runs, seed, perturbation]
      properties:
        runs: { type: integer }
        seed: { type: integer, description: Fixed seed, so the same data always gives the same answer. }
        perturbation: { type: string }
    AnalyzeResponse:
      type: object
      required: [mode, sites, sensitivity, methodology]
      properties:
        mode:
          type: string
          enum: [robotics, calibration, colony, custom]
        sites:
          type: array
          items: { $ref: "#/components/schemas/AnalyzedSite" }
        sensitivity:
          $ref: "#/components/schemas/Sensitivity"
        methodology:
          $ref: "#/components/schemas/Methodology"
    SiteDetail:
      allOf:
        - $ref: "#/components/schemas/AnalyzedSite"
        - type: object
          required: [mode, values, sources, valueSources, moon, explanation, methodology]
          properties:
            terrain: { type: string }
            explanation: { $ref: "#/components/schemas/Explanation" }
            methodology: { $ref: "#/components/schemas/Methodology" }
            mode: { $ref: "#/components/schemas/ModeId" }
            values:
              type: object
              description: Raw values of all available parameters (null = source unavailable).
              additionalProperties:
                type: number
                nullable: true
            sources:
              type: array
              items: { type: string }
            valueSources:
              type: object
              description: "Source of each known value: catalog id from `GET /api/sources` (or `fixtures` in sample-data mode)."
              additionalProperties: { type: string }
            moon:
              type: object
              description: Lunar reference (data/reference/moon-south-pole.json) of each sourced parameter, whatever the mode. A parameter without a reference is absent.
              additionalProperties: { $ref: "#/components/schemas/MoonValue" }
    MoonValue:
      type: object
      properties:
        min: { type: number }
        max: { type: number }
        unit: { type: string }
        source: { type: string }
    DataSource:
      type: object
      required: [id, name, provider, url, body, params, terms]
      properties:
        id: { type: string, example: nasa-power }
        name: { type: string }
        provider: { type: string }
        url: { type: string }
        body: { type: string, enum: [earth, moon] }
        params:
          type: array
          items: { $ref: "#/components/schemas/ParamId" }
        terms: { type: string }
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
